body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);background-size:20px 20px;
  min-height:100dvh;-webkit-user-select:none;user-select:none;font-size:15px;line-height:1.4;overscroll-behavior-y:contain}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:var(--accent-ink)}
#view{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(104px + env(safe-area-inset-bottom))}
.hand{font-family:'Caveat',cursive;font-weight:700}
h2.hl{font-family:'Caveat',cursive;font-size:28px;font-weight:700;margin:28px 0 12px 2px;display:inline-block;line-height:1.05;
  background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 92%,transparent 92%);padding:0 10px 0 6px;transform:rotate(-.7deg)}
h2.hl small{font-family:'Nunito';font-size:13px;color:var(--ink2);font-weight:700;margin-left:6px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid rgba(120,90,60,.07);margin-bottom:14px}
.tape::before{content:'';position:absolute;top:-10px;left:24px;width:78px;height:21px;border-radius:2px;transform:rotate(-4deg);opacity:.95;
  background:linear-gradient(90deg,var(--mint) 50%,transparent 50%) 0 0/8px 8px,linear-gradient(var(--mint) 50%,transparent 50%) 0 0/8px 8px,var(--mint-bg)}
.tape.r::before{left:auto;right:28px;transform:rotate(5deg)}
.tape.sage::before{background:rgba(163,172,143,.6)}
.tape.acc::before{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 9px),color-mix(in srgb,var(--accent) 45%,#fff)}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.logo{font-family:'Caveat',cursive;font-weight:700;font-size:40px;line-height:.9;letter-spacing:.3px}
.logo .sz{font-size:22px;margin-left:4px;display:inline-block;transform:translateY(-4px)}
.dayno{text-align:right;font-size:12.5px;color:var(--ink2);font-weight:700;line-height:1.25}
.dayno b{font-size:20px;color:var(--ink);font-weight:800}
.week{display:grid;grid-template-columns:26px repeat(7,1fr) 26px;gap:3px;align-items:center;margin:14px 0 4px}
.week .arr{height:44px;border-radius:12px;font-size:20px;color:var(--ink2);display:grid;place-items:center}
.week .arr:disabled{opacity:.2}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:16px;font-size:11px;color:var(--ink2);font-weight:700}
.wd b{font-size:15px;color:var(--ink);font-weight:800;line-height:1}
.wd.sel{background:var(--card);box-shadow:var(--shadow)}
.wd.tod b{color:var(--accent-ink)}
.wd:disabled{opacity:.3}
.ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--line) 0);
  -webkit-mask:radial-gradient(circle,transparent 5.5px,#000 6px);mask:radial-gradient(circle,transparent 5.5px,#000 6px)}
.ring.full{background:var(--accent);-webkit-mask:none;mask:none;display:grid;place-items:center;color:#fff;font-size:11px}
.dayttl{font-size:14px;color:var(--ink2);font-weight:700;margin:12px 2px 10px}
.dayttl b{color:var(--ink)}

/* hero */
.hero{display:flex;gap:10px;align-items:center;margin-top:10px}
.masc{flex:none;position:relative;display:flex;justify-content:center;align-items:flex-end}
.masc img{display:block;width:auto;height:auto;max-width:100%;max-height:var(--h,150px);filter:drop-shadow(0 3px 4px rgba(110,70,50,.25));transform-origin:50% 100%}
.hero .masc{width:112px}
.masc.m-happy img{animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.masc .fx{position:absolute;top:-6px;right:-4px;font-size:22px;animation:float 2.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.seasons div{padding:8px 2px 6px;border-radius:16px}
.seasons div.on{background:var(--accent-soft)}
.seasons img{display:block;height:86px;width:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(110,70,50,.22))}
.seasons span{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-top:4px}
.wgoal{margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--line)}
.wgoal .lbl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.wgoal .lbl b{color:var(--ink);white-space:nowrap}
.wdone{color:var(--ok);font-weight:800;font-size:13px;margin-top:7px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:var(--hl);color:var(--ink);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.bubble{position:relative;flex:1;background:var(--paper);border-radius:18px;padding:11px 13px;font-size:14.5px;line-height:1.38;border:1.5px dashed var(--line2);text-align:left;min-height:64px}
.bubble::before{content:'';position:absolute;left:-8px;top:24px;width:14px;height:14px;background:var(--paper);border-left:1.5px dashed var(--line2);border-bottom:1.5px dashed var(--line2);transform:rotate(45deg)}
.prog{margin-top:14px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.prog .lbl b{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--paper2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.ok>i{background:var(--ok)}
.bar.thin{height:6px}
.next-cp{margin-top:12px;font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.next-cp b{color:var(--ink)}

/* focus */
.focus{display:flex;gap:12px;align-items:flex-start}
.focus .fe{font-size:28px;line-height:1}
.focus .ft{font-family:'Caveat',cursive;font-size:24px;font-weight:700;line-height:1}
.focus .fk{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent-ink);font-weight:800}
.focus p{margin:4px 0 0;font-size:14px;color:var(--ink2)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row:first-child{padding-top:2px}
.ico{width:44px;height:44px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex:none}
.row.done .ico{background:var(--ok-soft)}
.txt{flex:1;min-width:0}
.t{font-weight:800;font-size:15.5px;line-height:1.25}
.t .r{float:right;font-weight:800}
.s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
.s .link{color:var(--accent-ink);font-weight:800;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.qa{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chk{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.counter{display:flex;align-items:center;gap:4px;flex:none}
.counter button{width:34px;height:34px;border-radius:50%;background:var(--paper2);font-weight:800;font-size:19px;line-height:1;display:grid;place-items:center}
.counter button.plus{background:var(--accent-soft);color:var(--accent-ink)}
.counter .n{min-width:40px;text-align:center;font-weight:800;font-size:14.5px}
.counter .n.ok{color:var(--ok)}
.line2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.line2 .s{margin-top:0;flex:1;min-width:0}
.meals{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.meal{min-width:62px;height:40px;border-radius:14px;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;font-weight:800;font-size:14px;color:var(--ink2)}
.meal.on{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.live{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent-ink)}
.rest .ico{background:var(--sage-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 20px;border-radius:999px;font-weight:800;background:var(--ink);color:var(--paper);font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--accent);color:#fff}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%}
.btn.danger{background:#fbe4e1;color:#a5372b}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}

/* due banner */
.due{background:#fff9d6;border:2px dashed #e4cf4a;animation:wiggle 1.6s ease-in-out 2}
.due .big{font-size:28px;line-height:1}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}

/* mood */
.moods{display:flex;justify-content:space-between;margin:10px 0 12px}
.moods button{width:50px;height:50px;border-radius:50%;font-size:27px;display:grid;place-items:center;filter:grayscale(.65);opacity:.55;transition:.2s}
.moods button.on{background:var(--accent-soft);filter:none;opacity:1;transform:scale(1.08)}
textarea.note{width:100%;min-height:70px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:10px 12px;font-size:15px;resize:vertical;outline:none}
textarea.note:focus{border-color:var(--accent)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,247,238,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1.5px dashed var(--line2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:14px}
#nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent-ink)}
#nav button.on svg{background:var(--accent-soft);border-radius:10px;padding:2px;width:44px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(46,30,18,.38);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90dvh;overflow:auto;overscroll-behavior:contain}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.sheet h3{font-family:'Caveat',cursive;font-size:30px;margin:0 0 4px;line-height:1.05}
.sheet .sub{font-size:14px;color:var(--ink2);margin:0 0 10px}
.open .sheet-bg{opacity:1}.open .sheet{transform:none}
.sheet.center{top:50%;bottom:auto;left:18px;right:18px;border-radius:26px;transform:translateY(-46%) scale(.92);opacity:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;text-align:center;padding:22px 20px 20px}
.open .sheet.center{transform:translateY(-50%);opacity:1}
.sheet.center .grab{display:none}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--ink2);font-weight:800;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.field textarea{height:auto;min-height:150px;padding:12px 14px;line-height:1.45;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.8px solid var(--line);margin:8px 0;text-align:left;width:100%}
.opt .oe{font-size:24px}
.opt b{display:block;font-size:15px}
.opt small{color:var(--ink2);font-size:12.5px}
.opt.on{border-color:var(--ok);background:var(--ok-soft)}
.opt .chk{margin-left:auto;width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 12px;border-radius:99px;background:var(--paper2);font-size:13.5px;font-weight:700;text-align:left}
.bigemo{font-size:64px;line-height:1;margin:6px 0 8px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);
  padding:12px 16px;border-radius:18px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#f9e84a;font-weight:800;white-space:nowrap;padding:4px 0}

/* confetti */
.conf{position:fixed;top:-40px;z-index:80;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--rot))}}

/* route */
.route{position:relative;margin-top:8px}
.route svg{position:absolute;left:0;top:0;overflow:visible}
.rbase{fill:none;stroke:var(--line2);stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round}
.rprog{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.stop{height:78px;padding-left:86px;display:flex;flex-direction:column;justify-content:center}
.stop .nm{font-weight:800;font-size:15.5px}
.stop .km{font-size:12.5px;color:var(--ink2)}
.stop.reached .nm{color:var(--ok)}
.stop.next .nm::after{content:'  ← далі';font-size:12px;color:var(--accent-ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--paper);border-radius:14px;padding:9px 10px;border:1px dashed var(--line2)}
.stat b{display:block;font-size:18px;font-weight:800;line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink2);font-weight:700;line-height:1.2;display:block}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:'Caveat',cursive;font-size:26px}
.calhead button{width:40px;height:40px;border-radius:50%;background:var(--paper2);font-size:18px}
.calhead button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:800;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--paper2);color:var(--ink2)}
.cal .c.off{background:transparent;color:var(--line2)}
.cal .c.l1{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--ink)}
.cal .c.l2{background:color-mix(in srgb,var(--accent) 38%,var(--card));color:var(--ink)}
.cal .c.l3{background:color-mix(in srgb,var(--accent) 66%,var(--card));color:#fff}
.cal .c.l4{background:var(--accent);color:#fff}
.cal .c.tod{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:12px;font-size:11.5px;color:var(--ink2);font-weight:700}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--card);border-radius:18px;padding:12px 6px 10px;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(120,90,60,.07)}
.bdg .e{font-size:30px;width:56px;height:56px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft)}
.bdg .bt{font-size:12px;font-weight:800;line-height:1.2;min-height:29px}
.bdg.locked .e{background:var(--paper2)}
.bdg.locked .e span{filter:grayscale(1);opacity:.4}
.bdg.locked .bt{color:var(--ink2)}
.bdg .bar{margin:7px 8px 0;height:5px}
.bdg .got{font-size:10.5px;color:var(--ok);font-weight:800;margin-top:5px}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .big{font-size:44px;line-height:1}
.lvl b{font-size:26px;font-weight:800}

/* body */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:18px;padding:12px 10px;box-shadow:var(--shadow);border:1px solid rgba(120,90,60,.07)}
.tile .k{font-size:12px;font-weight:800;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:800;line-height:1.15;margin:2px 0}
.tile .v small{font-size:12px;color:var(--ink2)}
.tile .dl{font-size:12px;font-weight:800;color:var(--ok)}
.tile .dl.up{color:var(--ink2)}
.tile .bar{margin-top:8px;height:6px}
.tile .g{font-size:11px;color:var(--ink2);margin-top:4px;font-weight:700}
.seg{display:flex;background:var(--paper2);border-radius:99px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;height:36px;border-radius:99px;font-weight:800;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px -2px rgba(80,50,20,.3)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:'Nunito',sans-serif;font-size:11px;fill:var(--muted);font-weight:700}
.chart .tip{position:absolute;transform:translate(-50%,-130%);background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:10px;white-space:nowrap;pointer-events:none}
.chart .tip[hidden]{display:none}
.cp{width:100%;border-collapse:collapse;font-size:13.5px}
.cp th{font-size:11.5px;color:var(--ink2);font-weight:800;text-align:left;padding:4px 4px 8px;border-bottom:1.5px dashed var(--line2)}
.cp td{padding:9px 4px;border-bottom:1px dashed var(--line);font-weight:700;white-space:nowrap}
.cp tr:last-child td{border-bottom:0}
.cp tr.nx td{background:#fff9d6}
.cp tr.nx td:first-child{border-radius:10px 0 0 10px}.cp tr.nx td:last-child{border-radius:0 10px 10px 0}
.cp .y{color:var(--ok)} .cp .n{color:var(--muted)}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist:last-child{border-bottom:0}
.hist .d{font-weight:800;width:54px;flex:none}
.hist .vals{flex:1;color:var(--ink2)}
.hist .vals b{color:var(--ink)}
.x{width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px;flex:none}
.win{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.win:last-child{border-bottom:0}
.win .wt{flex:1;font-weight:700}
.win .wt small{display:block;color:var(--muted);font-weight:700;font-size:12px}

/* me */
.hlist{margin:6px 0 0;padding:0;list-style:none}
.hlist li{padding:6px 0 6px 22px;position:relative;font-weight:700}
.hlist li::before{content:'';position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:#9ed36a}
.edit{position:absolute;top:12px;right:12px;height:34px;padding:0 12px;border-radius:99px;background:var(--paper2);font-size:13px;font-weight:800;color:var(--ink2)}
.cardttl{font-family:'Caveat',cursive;font-size:26px;font-weight:700;line-height:1;margin:2px 0 6px;padding-right:70px}

function fresh(){
  const on={};HABITS.forEach(h=>on[h.id]=h.on);
  return {v:2,weeks:{},weekTheme:{},themesOff:{},plan:{...DEF_PLAN},why:[...DEF_WHY],finish:[...DEF_FINISH],habits:{on,custom:[]},days:{},
    measures:[{d:'2026-10-13',w:69,waist:95,hips:106}],wins:[],badges:{},work:null,walk:null,mascot:null,lastBackup:null};
}
function migrate(s){
  const f=fresh();
  s.plan={...f.plan,...(s.plan||{})};
  for(const k of ['why','finish','days','measures','wins','badges','habits']) if(s[k]==null) s[k]=f[k];
  s.habits.on={...f.habits.on,...(s.habits.on||{})};
  s.habits.custom=s.habits.custom||[];
  s.weeks=s.weeks||{};s.weekTheme=s.weekTheme||{};s.themesOff=s.themesOff||{};
  // v1 мав помилкову норму 8 000 — у журналі 7 000
  if((s.v||1)<2){if(s.plan.steps===8000)s.plan.steps=7000;s.v=2}
  return s;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return migrate(JSON.parse(raw))}catch(e){}return fresh()}
let S=load();
let saveFail=false;

const mealsOf=d=>(getDay(d).meals||[]).slice(0,S.plan.meals);
const monday=d=>addDays(d,-((parse(d).getDay()+6)%7));
function focusIdx(d){const P=S.plan;if(d<P.start||d>P.finish)return -1;return Math.round(diff(monday(P.start),monday(d))/7)}
function habitOn(id){const hb=habitById(id);if(!hb)return false;return S.habits.on[id]!==undefined?!!S.habits.on[id]:hb.on!==false}
const focusById=id=>FOCUS.find(f=>f.id===id);
const themeLabel=(f,n)=>{const g=typeof f.g==='function'?f.g(S.plan):f.g;return `${n} ${plural(n,g[0],g[1],g[2])}`};
function themeOk(f){return !S.themesOff[f.id]&&(!f.needs||habitOn(f.needs))}
let themeDirty=false;
function themeFor(i){
  const st=S.weekTheme[i];if(st&&focusById(st))return focusById(st);
  let f=null;
  if(i<=0)f=FOCUS.find(themeOk)||FOCUS[0];
  else{const k=FOCUS.indexOf(themeFor(i-1));for(let j=1;j<=FOCUS.length;j++){const c=FOCUS[(k+j)%FOCUS.length];if(themeOk(c)){f=c;break}}if(!f)f=FOCUS[0]}
  if(i<=focusIdx(todayS())){S.weekTheme[i]=f.id;themeDirty=true}
  return f;
}

function weekInfo(i){
  const P=S.plan,t=todayS(),m=addDays(monday(P.start),i*7),a=m<P.start?P.start:m,e=addDays(m,6),b=e>P.finish?P.finish:e,f=themeFor(i);
  const len=diff(a,b)+1,n=Math.max(1,Math.ceil(f.n(P)*len/7));let cur=0;
  for(let d=a;d<=b&&d<=t;d=addDays(d,1))cur+=f.c(d);
  return {i,f,a,b,n,cur,done:cur>=n,label:themeLabel(f,n)};
}
function rangeStr(a,b){const A=parse(a),B=parse(b);if(a===b)return dateLong(a);

function habitsFor(d){
  const f=focusOf(d),hid=f&&(f.habit||f.needs),list=activeHabits().map(h=>hid&&h.id===hid?{...h,featured:true}:h);
  if(f&&f.habit&&!list.some(h=>h.id===f.habit)){const hb=habitById(f.habit);if(hb)list.push({...hb,featured:true})}
  return list.filter(h=>h.featured).concat(list.filter(h=>!h.featured));
}
function activeHabits(){return allHabits().filter(h=>S.habits.on[h.id]!==undefined?S.habits.on[h.id]:h.on!==false)}
function habitById(id){return allHabits().find(h=>h.id===id)}
function lastTrainBefore(d){let best=null;for(const k in S.days){if(k<d&&S.days[k].train&&(!best||k>best))best=k}return best}
function isTrainDay(d){if(getDay(d).train)return true;const l=lastTrainBefore(d);if(!l)return true;return diff(l,d)>=S.plan.trainEvery}
function dayItems(d){
  const x=getDay(d),P=S.plan,h=x.h||{},out=[];
  out.push({id:'steps',frac:clamp((x.steps||0)/P.steps,0,1)});
  if(isTrainDay(d))out.push({id:'train',frac:x.train?1:0});
  for(let i=0;i<P.meals;i++)out.push({id:'meal'+i,frac:(x.meals&&x.meals[i])?1:0});
  for(const hb of habitsFor(d)){const v=h[hb.id];out.push({id:hb.id,frac:hb.type==='count'?clamp((v||0)/habitTarget(hb),0,1):(v?1:0)})}

}

}

function computeStats(){
  const P=S.plan,end=todayS(),y=+P.start.slice(0,4);
  const st={steps:0,trains:0,walks:0,breaks:0,waterDays:0,sleep:0,kind:0,balanced:0,stepDays:0,streak:0,bestStreak:0,
    perfect:0,good:0,coreDays:0,comebacks:0,leaves:0,any:false,ny:false,
    season:{autumn:0,winter:0,spring:0,summer:0}};
  const rng={autumn:[P.start,`${y}-11-30`],winter:[`${y}-12-01`,`${y+1}-02-29`],spring:[`${y+1}-03-01`,`${y+1}-05-31`],summer:[`${y+1}-06-01`,`${y+1}-08-31`]};
  let prev=null;
  for(let d=P.start;d<=end;d=addDays(d,1)){
    const x=getDay(d),h=x.h||{},items=dayItems(d);
    const pct=items.reduce((a,b)=>a+b.frac,0)/items.length,full=items.filter(i=>i.frac>=1).length;
    st.leaves+=full;if(full>0||(x.steps||0)>0)st.any=true;
    st.steps+=x.steps||0;if(x.train)st.trains++;
    st.walks+=h.walk||0;st.breaks+=h.breaks||0;
    if((h.water||0)>=P.meals)st.waterDays++;
    if(h.sleep)st.sleep++;if(h.kind)st.kind++;
    let bal=P.meals>0;for(let i=0;i<P.meals;i++){const m=x.meals&&x.meals[i];if(!m||!m.veg||!m.protein)bal=false}
    if(bal)st.balanced++;
    const sd=(x.steps||0)>=P.steps;
    if(sd){st.stepDays++;st.streak++;st.bestStreak=Math.max(st.bestStreak,st.streak)}else if(d<end)st.streak=0;
    if(pct>=0.999)st.perfect++;
    if(pct>=0.6){st.good++;for(const s in rng)if(d>=rng[s][0]&&d<=rng[s][1])st.season[s]++}
    if(coreDone(d))st.coreDays++;
    if(prev!==null&&prev<0.35&&pct>=0.6)st.comebacks++;
    if(sd&&(d===`${y}-12-31`||d===`${y+1}-01-01`))st.ny=true;
    prev=pct;
  }
  st.km=kmOf(st.steps);
  st.minW=minOf('w');st.minWaist=minOf('waist');st.minHips=minOf('hips');
  st.meas=S.measures.length;st.wins=S.wins.length;
  st.weeksDone=0;const kinds=new Set();
  const lastI=focusIdx(end<P.finish?end:P.finish);
  for(let i=0;i<=lastI;i++){const w=weekInfo(i);if(w.done){st.weeksDone++;if(themeOk(w.f))kinds.add(w.f.id)}}
  st.focusKinds=kinds.size;st.focusTotal=Math.max(1,FOCUS.filter(themeOk).length);
  return st;
}

function render(top){
  const ae=document.activeElement;
  if(!top&&ae&&$('#view').contains(ae)&&/^(TEXTAREA|INPUT)$/.test(ae.tagName)){pendingRender=true;return}
  pendingRender=false;
  const y=window.scrollY;
  document.body.className='s-'+season();
  $('#view').innerHTML=({today:renderToday,path:renderPath,awards:renderAwards,body:renderBody,me:renderMe})[tab]();
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='path')layoutRoute();
  if(themeDirty){themeDirty=false;save()}
  if(tab==='today'){const n=$('#note');if(n)n.addEventListener('input',debounce(e=>{mutDay(sel).note=e.target.value;save()},400))}
  window.scrollTo(0,top?0:y);
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!/^(TEXTAREA|INPUT)$/.test((document.activeElement||{}).tagName||''))render()},50)});
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}

function weekStrip(){
  const P=S.plan,t=todayS(),minD=P.start<t?P.start:t,wd=(parse(sel).getDay()+6)%7,ws=addDays(sel,-wd);
  let h=`<div class="week"><button class="arr" data-act="wk" data-n="-7" aria-label="Попередній тиждень" ${addDays(ws,-1)<minD?'disabled':''}>‹</button>`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),dis=d<minD||d>t,p=dis?0:Math.round(dayPct(d)*100);
    h+=`<button class="wd ${d===sel?'sel':''} ${d===t?'tod':''}" data-act="day" data-d="${d}" ${dis?'disabled':''}>${WD_S[parse(d).getDay()]}<b>${parse(d).getDate()}</b>${p>=100?`<span class="ring full">✓</span>`:`<span class="ring" style="--p:${p}%"></span>`}</button>`;
  }
  return h+`<button class="arr" data-act="wk" data-n="7" aria-label="Наступний тиждень" ${addDays(ws,7)>t?'disabled':''}>›</button></div>`;
}

function renderToday(){
  const P=S.plan,t=todayS(),isT=sel===t,x=getDay(sel),h=x.h||{},se=season();
  const total=diff(P.start,P.finish)+1,dn=diff(P.start,sel)+1;
  const it=dayItems(sel),done=it.filter(i=>i.frac>=1).length,pct=it.reduce((a,b)=>a+b.frac,0)/it.length;
  let dayno;
  if(dn<1)dayno=`до старту<br><b>${days(1-dn)}</b>`;
  else if(dn>total)dayno=`фініш позаду<br><b>+${dn-total}</b> днів`;
  else dayno=`день <b>${dn}</b> з ${total}<br>до літа ${days(total-dn)}`;
  const dObj=parse(sel);
  const ttl=isT?`<b>Сьогодні</b>, ${WD[dObj.getDay()]}, ${dateLong(sel)}`:sel===addDays(t,-1)?`<b>Учора</b>, ${dateLong(sel)} · можна дописати`:`<b>${dateLong(sel)}</b>, ${WD[dObj.getDay()]} · <button class="link" data-act="day" data-d="${t}" style="color:var(--accent-ink);font-weight:800;text-decoration:underline">до сьогодні</button>`;
  const lines=bearLines();if(bubbleIdx<0||bubbleIdx>=lines.length)bubbleIdx=0;
  let html=`<header class="top"><div class="logo">Стежка<span class="sz">${SEASON_EMO[se][0]}</span></div><div class="dayno">${dayno}</div></header>${weekStrip()}<div class="dayttl">${ttl}</div>`;

  // перерва
  if(isT&&S.work&&Date.now()>=S.work.last+P.breakMin*6e4){
    html+=`<div class="card due"><div class="hand big">Час розімʼятися! 🙆‍♀️</div><p style="margin:6px 0 12px;font-weight:700">${esc(S.work.idea||pick(BREAK_IDEAS))}</p><div class="qa"><button class="btn acc sm" data-act="breakDone">Зроблено ✓</button><button class="btn ghost sm" data-act="breakSnooze">Ще 5 хвилин</button></div></div>`;
  }
  // герой
  const cp=nextCheckpoint();
  html+=`<div class="card tape"><div class="hero">${mascotHTML(bearMood(),se,150)}<button class="bubble" data-act="bubble">${esc(lines[bubbleIdx])}</button></div>
   <div class="prog"><div class="lbl"><span>${isT?'Сьогодні':'Цей день'}: <b>${done} з ${it.length}</b></span><span>🍃 +${done}</span></div><div class="bar ${pct>=0.999?'ok':''}"><i style="width:${Math.round(pct*100)}%"></i></div></div>
   ${cp&&isT?`<div class="next-cp"><span>🎯</span><span>Найближча контрольна точка — <b>${dateLong(cp.d)}</b>${cp.final?' (фініш)':''}: вага ≤ ${fmt(cp.w,1)} кг, талія ≤ ${fmt(cp.waist,1)}, стегна ≤ ${fmt(cp.hips,1)} см. Ще ${days(diff(t,cp.d))}.</span></div>`:''}
  </div>`;
  // нагадування про замір
  const lm=measuresSorted().slice(-1)[0];
  if(isT&&lm&&diff(lm.d,t)>=14)html+=`<div class="card tape sage" style="display:flex;gap:12px;align-items:center"><div style="font-size:26px">📏</div><div style="flex:1"><b>Час для заміру</b><div class="s">Останній був ${days(diff(lm.d,t))} тому</div></div><button class="btn sm soft" data-act="addMeasure">Записати</button></div>`;
  // фокус і виклик тижня
  {const wi=focusIdx(sel);if(wi>=0){const w=weekInfo(wi),f=w.f,pc=Math.min(1,w.cur/w.n);
    html+=`<div class="card"><div class="focus"><div class="fe">${f.e}</div><div style="flex:1;min-width:0"><div class="fk">Тиждень ${wi+1} · ${rangeStr(w.a,w.b)}</div><div class="ft">${f.t}</div><p>${f.p(P)}</p>
     <div class="wgoal"><div class="lbl"><span>Виклик тижня: ${esc(w.label)}</span><b>${Math.min(w.cur,w.n)} / ${w.n}</b></div><div class="bar thin ${w.done?'ok':''}"><i style="width:${pc*100}%"></i></div>
     ${w.done?'<div class="wdone">Виконано ✓ Так тримати!</div>':''}</div></div></div></div>`}}

  // головне
  const steps=x.steps||0,sp=clamp(steps/P.steps,0,1);
  let streak=0;{let d=sel;if((getDay(d).steps||0)<P.steps)d=addDays(d,-1);while(d>=P.start&&(getDay(d).steps||0)>=P.steps){streak++;d=addDays(d,-1)}}
  const stepsRow=`<div class="row ${steps>=P.steps?'done':''}"><div class="ico">👣</div><div class="txt">
     <div class="t">Кроки <span class="r">${fmt(steps)} <span class="muted" style="font-weight:700">/ ${fmt(P.steps)}</span></span></div>
     <div class="bar thin ${sp>=1?'ok':''}" style="margin:8px 0 6px"><i style="width:${sp*100}%"></i></div>
     <div class="s">≈ ${fmt(kmOf(steps),1)} км${streak>1?` · серія ${days(streak)} 🔥`:''}</div>
     <div class="qa"><button class="btn sm soft" data-act="steps+" data-n="500">+500</button><button class="btn sm soft" data-act="steps+" data-n="1000">+1000</button><button class="btn sm ghost" data-act="stepsEdit">✎ Ввести з телефона</button></div></div></div>`;
  const td=isTrainDay(sel);
  const trainRow=td?`<div class="row ${x.train?'done':''}"><div class="ico">💪</div><div class="txt"><div class="t">Тренування</div><div class="s">${x.train?'Зроблено — ти молодець!':'Сьогодні день тренування'}${P.workoutUrl?` · <a class="link" href="${esc(P.workoutUrl)}" target="_blank" rel="noopener">відкрити ↗</a>`:''}</div></div><button class="chk ${x.train?'on':''}" data-act="train" aria-label="Тренування">${CHECK}</button></div>`
   :`<div class="row rest"><div class="ico">🛋️</div><div class="txt"><div class="t">День відновлення</div><div class="s">Тренування — завтра. Легка прогулянка чи розтяжка — за бажанням. <button class="link" data-act="train">Все ж потренувалась</button></div></div></div>`;
  let chips='',withP=0,withC=0;
  for(let i=0;i<P.meals;i++){const m=x.meals&&x.meals[i];if(m&&m.protein)withP++;if(m&&m.carbs)withC++;
    chips+=`<button class="meal ${m?'on':''}" data-act="meal" data-i="${i}">${m?`${i+1}-й ✓ ${m.protein?'🍗':''}${m.carbs?'🥣':''}${m.veg?'🥦':''}`:`＋ ${i+1}-й`}</button>`}
  const mealsDone=it.filter(i=>i.id.startsWith('meal')&&i.frac>=1).length;
  const mealRow=`<div class="row ${mealsDone>=P.meals?'done':''}"><div class="ico">🍽️</div><div class="txt"><div class="t">Повноцінні прийоми їжі <span class="r">${mealsDone}/${P.meals}</span></div>
     <div class="s">Натисни, щоб відмітити. З білком: ${withP} · з кашею: ${withC}${P.menuUrl?` · <a class="link" href="${esc(P.menuUrl)}" target="_blank" rel="noopener">меню ↗</a>`:''}</div><div class="meals">${chips}</div></div></div>`;
  html+=`<h2 class="hl">Головне <small>з твого плану</small></h2><div class="card">${stepsRow}${trainRow}${mealRow}</div>`;

  // маленькі звички
  const hs=habitsFor(sel);
  if(hs.length){
    html+=`<h2 class="hl">Маленькі звички <small>великий ККД</small></h2><div class="card">`;
    for(const hb of hs){
      const v=h[hb.id],tg=habitTarget(hb),isDone=hb.type==='count'?(v||0)>=tg:!!v;
      let sub='',ctrl='';
      if(hb.type==='count'){
        ctrl=`<div class="counter"><button data-act="hc" data-id="${hb.id}" data-n="-1" aria-label="Мінус">−</button><span class="n ${isDone?'ok':''}">${v||0}/${tg}</span><button class="plus" data-act="hc" data-id="${hb.id}" data-n="1" aria-label="Плюс">+</button></div>`;
      }else ctrl=`<button class="chk ${v?'on':''}" data-act="hk" data-id="${hb.id}" aria-label="${esc(hb.n)}">${CHECK}</button>`;
      if(hb.id==='walk'&&isT){sub=S.walk?`🚶‍♀️ <span class="live" id="walkLeft">${mmss(S.walk.end-Date.now())}</span> · <button class="link" data-act="walkStop">стоп</button>`:`<button class="link" data-act="walkStart">▶ Таймер 10 хв</button>`}
      else if(hb.id==='breaks'&&isT){sub=S.work?`⏱ <span class="live" id="workLeft">${mmss(S.work.last+P.breakMin*6e4-Date.now())}</span> · <button class="link" data-act="workStop">стоп</button>`:`<button class="link" data-act="workStart">▶ Нагадувати</button>`}
      else if(hb.id==='kind'&&x.kindText)sub=`«${esc(x.kindText)}»`;
      else sub=`<button class="link" data-act="why" data-id="${hb.id}" style="color:var(--ink2);font-weight:700;text-decoration:none">чому це працює ›</button>`;
      html+=hb.type==='count'
        ?`<div class="row ${isDone?'done':''}"><button class="ico" data-act="why" data-id="${hb.id}" aria-label="Чому це працює">${esc(hb.e)}</button><div class="txt"><div class="t">${esc(hb.n)}${hb.featured?'<span class="tag">звичка тижня</span>':''}</div><div class="line2"><div class="s">${sub}</div>${ctrl}</div></div></div>`
        :`<div class="row ${isDone?'done':''}"><button class="ico" data-act="why" data-id="${hb.id}" aria-label="Чому це працює">${esc(hb.e)}</button><div class="txt"><div class="t">${esc(hb.n)}${hb.featured?'<span class="tag">звичка тижня</span>':''}</div><div class="s">${sub}</div></div>${ctrl}</div>`;
    }
    html+=`</div>`;
  }
  // самопочуття
  html+=`<h2 class="hl">Як я сьогодні?</h2><div class="card"><div class="moods">${MOODS.map((m,i)=>`<button class="${x.mood===i+1?'on':''}" data-act="mood" data-v="${i+1}" aria-label="Настрій ${i+1}">${m}</button>`).join('')}</div>
    <textarea class="note" id="note" placeholder="Нотатка дня: що допомогло, що завадило…">${esc(x.note||'')}</textarea></div>`;
  return html;
}
function mmss(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return `${pad(Math.floor(s/60))}:${pad(s%60)}`}

/* ── Стежка ── */
let RG=null;
function renderPath(){
  const P=S.plan,t=todayS(),st=computeStats(),RS=routeSteps();
  const expSteps=P.steps*clamp(diff(P.start,t),0,planDays());
  const prog=clamp(st.steps/RS,0,1),nx=ROUTE.find(r=>stopSteps(r)>st.steps)||null;
  const dd=Math.round((st.steps-expSteps)/P.steps);
  let html=`<header class="top"><div class="logo">Стежка</div><div class="dayno">від Києва<br><b>до моря</b></div></header>
  <div class="card tape" style="margin-top:16px"><div class="cardttl" style="padding:0">Пройдено ${fmt(prog*100,prog<0.1?1:0)}% стежки</div>
   <div class="bar" style="margin:10px 0 8px"><i style="width:${prog*100}%"></i></div>
   <div class="s">${nx?`Наступна зупинка — <b style="color:var(--ink)">${nx.n}</b>: ще ≈ ${fmt(Math.ceil((stopSteps(nx)-st.steps)/1000)*1000)} кроків (≈ ${days(Math.max(1,Math.ceil((stopSteps(nx)-st.steps)/P.steps)))} за нормою)`:'Ти дійшла до моря! Далі — узбережжям, скільки захочеш 🌊'}</div>
   <div class="stats3"><div class="stat"><b>${fmt(st.steps)}</b><span>кроків від старту · ≈ ${fmt(st.km,0)} км</span></div><div class="stat"><b>${dd>0?'+':dd<0?'−':''}${days(Math.abs(dd))}</b><span>${dd>0?'попереду графіка':dd<0?'відстаю від графіка':'точно за графіком'}</span></div><div class="stat"><b>${st.trains}</b><span>${plural(st.trains,'тренування','тренування','тренувань')}</span></div></div>
   ${dd<=-2?'<div class="s" style="margin-top:10px">Наздогнати допоможуть прогулянки після їжі: кожні 10 хвилин — це ще ≈ 1 000 кроків.</div>':''}
  </div>`;
  const rowH=78,n=ROUTE.length,H=n*rowH,xs=ROUTE.map((_,i)=>i%2?54:26),ys=ROUTE.map((_,i)=>i*rowH+rowH/2);
  let d=`M${xs[0]} ${ys[0]}`;const segs=[];
  for(let i=1;i<n;i++){const s=` C${xs[i-1]} ${ys[i-1]+rowH*.55} ${xs[i]} ${ys[i]-rowH*.55} ${xs[i]} ${ys[i]}`;d+=s;segs.push(`M${xs[i-1]} ${ys[i-1]}`+s)}
  RG={xs,ys,segs,km:prog*ROUTE_KM,exp:clamp(expSteps/RS,0,1)*ROUTE_KM};
  let nodes='';ROUTE.forEach((r,i)=>{const reached=st.steps>=stopSteps(r);nodes+=`<circle cx="${xs[i]}" cy="${ys[i]}" r="13" fill="${reached?'var(--accent)':'var(--card)'}" stroke="${reached?'var(--accent)':'var(--line2)'}" stroke-width="2.5"/><text x="${xs[i]}" y="${ys[i]+5}" text-anchor="middle" font-size="13">${r.e}</text>`});
  const head=S.mascot||ALP_HEAD[season()];
  const marker=`<g id="rBear" style="transition:transform .6s"><circle r="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/><image href="${head}" x="-20.5" y="-20.5" width="41" height="41" clip-path="url(#rClip)" preserveAspectRatio="xMidYMid slice"/></g>`;
  const ghost=`<g id="rExp"><circle r="7" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="3 3"/></g>`;
  let rows='';ROUTE.forEach(r=>{const reached=st.steps>=stopSteps(r),when=addDays(P.start,Math.max(0,Math.ceil(stopSteps(r)/P.steps)-1));
    rows+=`<div class="stop ${reached&&r.km?'reached':''} ${nx===r?'next':''}"><div class="nm">${r.n}</div><div class="km">${r.d} · ${r.km===0?'старт '+dateShort(P.start):reached?'пройдено ✓':'за графіком — '+dateLong(when)}</div></div>`});
  html+=`<h2 class="hl">Маршрут</h2><div class="card"><div class="route" style="height:${H}px"><svg width="90" height="${H}" viewBox="0 0 90 ${H}"><defs><clipPath id="rClip"><circle r="20.5"/></clipPath></defs><path id="rBase" class="rbase" d="${d}"/><path id="rProg" class="rprog" d="${d}" style="stroke-dasharray:0 100000"/>${nodes}${ghost}${marker}</svg>${rows}</div>
   <div class="s" style="margin-top:6px">Маршрут підлаштований під твій план: проходиш ${fmt(P.steps)} кроків щодня — і ${dateLong(P.finish)} ти біля моря. Відстані між містами умовні. ◌ — де ти була б за графіком.</div></div>`;
  html+=`<h2 class="hl">Календар</h2><div class="card">${calendarHTML()}</div>`;
  return html;
}
function layoutRoute(){
  const base=$('#rBase');if(!base||!RG)return;
  const svg=base.ownerSVGElement,ns='http://www.w3.org/2000/svg',cum=[0];
  for(const s of RG.segs){const p=document.createElementNS(ns,'path');p.setAttribute('d',s);svg.appendChild(p);cum.push(cum[cum.length-1]+p.getTotalLength());p.remove()}
  const lenAt=k=>{const n=ROUTE.length;if(k<=0)return 0;if(k>=ROUTE[n-1].km)return cum[n-1];for(let i=0;i<n-1;i++){if(k<ROUTE[i+1].km)return cum[i]+(k-ROUTE[i].km)/(ROUTE[i+1].km-ROUTE[i].km)*(cum[i+1]-cum[i])}return cum[n-1]};
  const L=lenAt(RG.km),pt=base.getPointAtLength(L);
  $('#rProg').style.strokeDasharray=`${L} 100000`;
  $('#rBear').setAttribute('transform',`translate(${pt.x} ${pt.y})`);
  const E=lenAt(RG.exp),pe=base.getPointAtLength(E),g=$('#rExp');
  if(Math.abs(E-L)<14)g.style.display='none';else g.setAttribute('transform',`translate(${pe.x} ${pe.y})`);
}
function calendarHTML(){
  const P=S.plan,t=todayS(),[yy,mm]=calMonth.split('-').map(Number),first=new Date(yy,mm-1,1),dim=new Date(yy,mm,0).getDate(),off=(first.getDay()+6)%7;
  const minM=P.start.slice(0,7),maxM=(P.finish>t?P.finish:t).slice(0,7);
  let h=`<div class="calhead"><button data-act="cal" data-n="-1" ${calMonth<=minM?'disabled':''} aria-label="Попередній місяць">‹</button><b>${MONTHS_N[mm-1]} ${yy}</b><button data-act="cal" data-n="1" ${calMonth>=maxM?'disabled':''} aria-label="Наступний місяць">›</button></div><div class="cal">`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].forEach(w=>h+=`<div class="h">${w}</div>`);
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let dd=1;dd<=dim;dd++){
    const d=`${yy}-${pad(mm)}-${pad(dd)}`;
    if(d<P.start||d>t){h+=`<div class="c off">${dd}</div>`;continue}
    const p=dayPct(d),l=p>=0.999?4:p>=0.6?3:p>=0.3?2:p>0?1:0;
    h+=`<button class="c l${l} ${d===t?'tod':''}" data-act="day" data-d="${d}" data-go="1">${dd}</button>`;
  }
  return h+`</div><div class="legend">менше <i style="background:var(--paper2)"></i><i style="background:color-mix(in srgb,var(--accent) 16%,var(--card))"></i><i style="background:color-mix(in srgb,var(--accent) 38%,var(--card))"></i><i style="background:color-mix(in srgb,var(--accent) 66%,var(--card))"></i><i style="background:var(--accent)"></i> усе</div>`;
}

/* ── Нагороди ── */
function renderAwards(){
  const {st,list}=checkBadges(true),got=list.filter(b=>S.badges[b.id]).length;
  // рівень n починається з 20·n·(n−1) листочків: 0, 40, 120, 240, 400, 600, 840…
  const LV=['Альпаченя','Мандрівниця','Дослідниця стежок','Підкорювачка пагорбів','Лісова провідниця','Гірська мандрівниця','Майстриня звичок','Володарка сезонів','Морська душа','Легенда стежки'];
  const th=n=>20*n*(n-1);let lvl=1;while(st.leaves>=th(lvl+1))lvl++;
  const per=th(lvl+1)-th(lvl),rest=th(lvl+1)-st.leaves;
  let html=`<header class="top"><div class="logo">Нагороди</div><div class="dayno">зібрано<br><b>${got}</b> з ${list.length}</div></header>
   <div class="card tape" style="margin-top:16px"><div class="lvl"><div class="big">🍃</div><div style="flex:1"><b>${fmt(st.leaves)}</b> <span class="ink2" style="font-weight:700">${plural(st.leaves,'листочок','листочки','листочків')}</span>
   <div class="s">Рівень ${lvl} · ${LV[Math.min(lvl-1,LV.length-1)]} · до наступного ${rest} 🍃</div><div class="bar thin" style="margin-top:8px"><i style="width:${(per-rest)/per*100}%"></i></div></div></div>
   <div class="s" style="margin-top:10px">Листочок — за кожен повністю виконаний пункт дня.</div></div>`;
  const cats=[...new Set(list.map(b=>b.cat))];
  for(const c of cats){
    const bs=list.filter(b=>b.cat===c);
    html+=`<h2 class="hl">${c} <small>${bs.filter(b=>S.badges[b.id]).length}/${bs.length}</small></h2><div class="badges">`;

function chartHTML(mk){
  const P=S.plan,M=MET[mk],v0=P[M.v0],g=P[M.g],T=Math.max(1,diff(P.start,P.finish));
  const pts=measuresSorted().filter(m=>m[M.k]!=null&&!isNaN(m[M.k])).map(m=>({t:diff(P.start,m.d),v:m[M.k],d:m.d}));
  const W=340,H=210,ml=34,mr=16,mt=16,mb=26;
  const tMin=Math.min(0,...pts.map(p=>p.t)),tMax=Math.max(T,...pts.map(p=>p.t));
  const vals=[v0,g,...pts.map(p=>p.v)];
  const vMin=Math.floor(Math.min(...vals)-1),vMax=Math.ceil(Math.max(...vals)+1);
  const X=t=>ml+(t-tMin)/(tMax-tMin)*(W-ml-mr),Y=v=>mt+(vMax-v)/(vMax-vMin)*(H-mt-mb);
  const A=t=>v0+(g-v0)*t/T,B=t=>Math.max(g,v0-t/30.44);
  const up=[],lo=[];for(let t=0;t<=T;t+=5){up.push([X(t),Y(Math.max(A(t),B(t)))]);lo.push([X(t),Y(Math.min(A(t),B(t)))])}
  up.push([X(T),Y(Math.max(A(T),B(T)))]);lo.push([X(T),Y(Math.min(A(T),B(T)))]);
  const band=up.concat(lo.reverse()).map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const r=vMax-vMin,step=r<=7?1:r<=14?2:r<=30?5:10;
  let grid='';for(let v=Math.ceil(vMin/step)*step;v<=vMax;v+=step)grid+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  let xt='';const s=parse(P.start);for(let k=1;k<=12;k++){const d=ymd(new Date(s.getFullYear(),s.getMonth()+k,1));const tt=diff(P.start,d);if(tt>tMax)break;if(tt<tMin)continue;
    xt+=`<line x1="${X(tt)}" x2="${X(tt)}" y1="${H-mb}" y2="${H-mb+4}" stroke="var(--line2)"/><text x="${X(tt)}" y="${H-8}" text-anchor="middle">${MON_S[parse(d).getMonth()]}</text>`}
  const line=pts.length>1?`<polyline points="${pts.map(p=>`${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const dots=pts.map(p=>{const tip=`${dateShort(p.d)} · ${fmt(p.v,1)} ${M.u}`;return `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="16" fill="transparent" data-act="pt" data-x="${(X(p.t)/W*100).toFixed(2)}" data-y="${(Y(p.v)/H*100).toFixed(2)}" data-tip="${esc(tip)}"/>`}).join('');
  const lp=pts[pts.length-1];
  const lastLbl=lp?`<text x="${Math.min(X(lp.t)+9,W-mr-30)}" y="${Y(lp.v)-9}" style="fill:var(--ink);font-weight:800;font-size:12px">${fmt(lp.v,1)}</text>`:'';
  const goal=`<line x1="${X(T)}" x2="${X(T)}" y1="${Y(g)}" y2="${Y(g)-16}" stroke="var(--ink2)" stroke-width="1.5"/><path d="M${X(T)} ${Y(g)-16}l-12 4 12 4z" fill="var(--accent)"/><circle cx="${X(T)}" cy="${Y(g)}" r="3.5" fill="var(--accent)"/><text x="${X(T)-16}" y="${Y(g)+4}" text-anchor="end" style="fill:var(--accent-ink);font-weight:800">ціль ${fmt(g,1)}</text>`;
  const bandLbl=`<text x="${X(T*0.7)}" y="${Y(Math.min(A(T*0.7),B(T*0.7)))+15}" text-anchor="middle" style="fill:var(--ok);font-weight:800">коридор плану</text>`;
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік: ${M.n}">${grid}<polygon points="${band}" fill="var(--ok)" opacity=".16"/>${bandLbl}${xt}<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="var(--line2)"/>${goal}${line}${dots}${lastLbl}</svg><div class="tip" hidden></div></div>`;
}

/* Кнопка «назад» на Android закриває верхню шторку. Поки відкрита хоч одна шторка,
   в історії лежить рівно один запис; так немає гонки, коли одна шторка закривається, а інша одразу відкривається. */
const stack=[];let pendingBack=false;
function openSheet(html,opts={}){
  const w=document.createElement('div');w.className='sheet-wrap';
  w.innerHTML=`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet ${opts.cls||''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  if(!stack.length&&!pendingBack)history.pushState({sheet:1},'');
  stack.push(w);
  if(opts.mount)opts.mount(w);
  return w;
}
function dropTop(){const w=stack.pop();if(!w)return;w.classList.remove('open');setTimeout(()=>w.remove(),300)}
function closeSheet(){dropTop();if(!stack.length&&!pendingBack){pendingBack=true;history.back()}}
window.addEventListener('popstate',()=>{
  if(pendingBack){pendingBack=false;if(stack.length)history.pushState({sheet:1},'');return}
  if(stack.length){dropTop();if(stack.length)history.pushState({sheet:1},'')}
});
let toastT;
function toast(msg,action){
  const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:''}`;
  if(action)el.querySelector('button').onclick=()=>{el.classList.remove('show');action.fn()};
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),action?6000:2600);
}

    c.style.setProperty('--rot',(Math.random()*720-360)+'deg');c.style.fontSize=(18+Math.random()*16)+'px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4800)}
}

/* ───────── таймери ───────── */
let actx=null;
function ensureAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function chime(){if(!actx)return;try{const t=actx.currentTime;[660,880,990].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t+i*.16);g.gain.linearRampToValueAtTime(.16,t+i*.16+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.16+.6);o.connect(g).connect(actx.destination);o.start(t+i*.16);o.stop(t+i*.16+.65)})}catch(e){}}
function askNotify(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function notify(title,body){
  try{if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
    const o={body,icon:'icon-192.png',badge:'icon-192.png',tag:'stezhka',renotify:true,vibrate:[200,100,200]};
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>new Notification(title,o));
    else new Notification(title,o)}catch(e){}
}
function walkStart(){ensureAudio();askNotify();S.walk={end:Date.now()+10*6e4,d:todayS()};save();if(tab!=='today'){tab='today'}sel=todayS();render();toast('Таймер пішов. Гарної прогулянки 🐾')}
function tick(){
  const now=Date.now();let changed=false;
  const t=todayS();if(t!==lastToday){if(sel===lastToday)sel=t;lastToday=t;changed=true}
  if(S.walk&&now>=S.walk.end){const d=mutDay(S.walk.d);d.h=d.h||{};d.h.walk=(d.h.walk||0)+1;S.walk=null;save();changed=true;
    toast('Прогулянку зараховано 🐾');notify('Прогулянку зараховано 🐾','10 хвилин руху — є!');buzz([200,100,200]);chime()}
  if(S.work){const due=S.work.last+S.plan.breakMin*6e4;
    if(now>=due&&S.work.notified!==due){S.work.notified=due;S.work.idea=pick(BREAK_IDEAS);save();changed=true;
      notify('Час розімʼятися 🙆‍♀️',S.work.idea);buzz([300,120,300]);chime()}}
  if(changed){checkBadges();if(tab==='today')render()}
  else{const wl=$('#walkLeft');if(wl&&S.walk)wl.textContent=mmss(S.walk.end-now);const kl=$('#workLeft');if(kl&&S.work)kl.textContent=mmss(S.work.last+S.plan.breakMin*6e4-now)}
}

  closeSheet:()=>closeSheet(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});

$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.plan||!o.days)throw 0;askConfirm('Замінити поточні дані копією з файлу?','Відновити',()=>{S=migrate(o);save();sel=todayS();render(true);toast('Дані відновлено ✓')})}catch(err){toast('Це не схоже на копію Стежки')}};r.readAsText(f)});
$('#fileMascot').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const img=new Image();
  img.onload=()=>{const k=Math.min(1,320/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.mascot=c.toDataURL('image/png');URL.revokeObjectURL(img.src);save();render();toast('Талісман оновлено')};
  img.onerror=()=>toast('Не вдалося відкрити картинку');img.src=URL.createObjectURL(f)});

/* ───────── старт ───────── */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='me')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(tab==='me')render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
save();checkBadges(true);render(true);tick();setInterval(tick,1000);
</script>
</body>
</html>
